# 自动编译"上电直接启动"的 FUR-602 multi-layout FIP
# 用法：新建一个空 GitHub 仓库 → 把本文件放到 .github/workflows/auto-boot-fip.yml
#       → Actions 页手动 Run workflow → 等约 10~15 分钟 → 下载 artifact
# 无需本地编译（4G 老机也不怕），无需 fork 原仓库，全自动 clone+改配置+编译+上传
name: AutoBoot-FIP-builder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本仓库（仅放 workflow）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl
          # 用原仓库自带的依赖清单，避免漏包
          echo "依赖将在 clone 后按需安装"

      - name: 克隆源码 (TimouL/bl-mt798x-dhcpd)
        run: |
          git clone https://github.com/TimouL/bl-mt798x-dhcpd -b master src
          cd src
          sudo apt-get update
          # depends 清单 + MTK u-boot 常见缺失的 host 依赖（bc/swig/gnutls/uuid 编 tools 必需）
          sudo apt-get install -y $(cat depends/ubuntu-22.04) bc swig libgnutls28-dev uuid-dev

      - name: 打补丁：关掉 bootmenu/web 拦截，上电自动启动
        run: |
          cd src
          # fur-602 的 ATF 配置只存在于 2022/2024 目录，2025 没有 → 用 2024
          DEF=uboot-mtk-20230718-09eda825/configs/mt7981_honor_fur-602_multi_layout_defconfig
          test -f "$DEF" || { echo "defconfig 未找到！"; exit 1; }
          sed -i 's/^CONFIG_MEDIATEK_BOOTMENU=y/# CONFIG_MEDIATEK_BOOTMENU is not set/' "$DEF"
          sed -i '/^CONFIG_MEDIATEK_BOOTMENU_DELAY=3/d' "$DEF"
          sed -i 's/^CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y/# CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE is not set/' "$DEF"
          sed -i 's/^CONFIG_AUTOBOOT_MENU_SHOW=y/# CONFIG_AUTOBOOT_MENU_SHOW is not set/' "$DEF"
          sed -i 's/^CONFIG_AUTOBOOT_MENU_MTK_SHOW=y/# CONFIG_AUTOBOOT_MENU_MTK_SHOW is not set/' "$DEF"
          grep -q '^CONFIG_BOOTDELAY=' "$DEF" || echo 'CONFIG_BOOTDELAY=0' >> "$DEF"
          # 启用内置 DHCP server：进 web 恢复时自动给电脑分配 IP，免手动设 192.168.1.*
          grep -q '^CONFIG_MTK_DHCPD=y' "$DEF" || echo 'CONFIG_MTK_DHCPD=y' >> "$DEF"
          echo "=== 补丁后关键行 ==="
          grep -E 'BOOTMENU|AUTOBOOT|WEB_FAILSAFE|BOOTDELAY|DHCPD' "$DEF"

      - name: 编译 multi-layout FIP (mt7981 / honor_fur-602 / 2024)
        run: |
          cd src
          chmod +x ./build.sh
          set -o pipefail
          SOC=mt7981 BOARD=honor_fur-602 VERSION=2024 MULTI_LAYOUT=1 ./build.sh 2>&1 | tee build_full.log

      - name: 失败时把日志尾部发到 issue（远程排错用）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "自动编译失败。Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            tail -n 300 src/build_full.log
          } | jq -Rs "{title: \"FIP build fail log run=${GITHUB_RUN_ID}\", body: .}" > payload.json
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/issues -d @payload.json)
          echo "issue POST HTTP=$HTTP"
          grep -o '"html_url": *"[^"]*issues/[^"]*"' /tmp/resp.json || cat /tmp/resp.json

      - name: 失败时上传完整编译日志（artifact 兜底）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: src/build_full.log
          if-no-files-found: ignore

      - name: 列出产物
        run: |
          cd src
          ls -la output/ 2>/dev/null || { echo "output 目录为空，编译可能失败"; exit 1; }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: honor_fur-602-autoboot-fip
          path: src/output/*.bin
          if-no-files-found: error
