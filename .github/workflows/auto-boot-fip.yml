# 自动编译"上电直接启动"的 FUR-602 multi-layout FIP
# 用法：新建一个空 GitHub 仓库 → 把本文件放到 .github/workflows/auto-boot-fip.yml
#       → Actions 页手动 Run workflow → 等约 10~15 分钟 → 下载 artifact
# 无需本地编译（4G 老机也不怕），无需 fork 原仓库，全自动 clone+改配置+编译+上传
name: AutoBoot-FIP-builder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本仓库（仅放 workflow）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl
          # 用原仓库自带的依赖清单，避免漏包
          echo "依赖将在 clone 后按需安装"

      - name: 克隆源码 (TimouL/bl-mt798x-dhcpd)
        run: |
          git clone https://github.com/TimouL/bl-mt798x-dhcpd -b master src
          cd src
          sudo apt-get update
          # depends 清单 + MTK u-boot 常见缺失的 host 依赖（bc/swig/gnutls/uuid 编 tools 必需）
          sudo apt-get install -y $(cat depends/ubuntu-22.04) bc swig libgnutls28-dev uuid-dev

      - name: 打补丁：关掉 bootmenu/web 拦截，上电自动启动
        run: |
          cd src
          # fur-602 的 ATF 配置只存在于 2022/2024 目录，2025 没有 → 用 2024
          DEF=uboot-mtk-20230718-09eda825/configs/mt7981_honor_fur-602_multi_layout_defconfig
          test -f "$DEF" || { echo "defconfig 未找到！"; exit 1; }
          # ⚠️ 关键：绝不能关 CONFIG_MEDIATEK_BOOTMENU！
          # board/mediatek/common/Makefile 里 failsafe.o(web救援) / cmd_mtkupgrade.o(网页刷固件)
          # / mtd_helper.o 全挂在 CONFIG_MEDIATEK_BOOTMENU 之下，关掉它 = 失去唯一救砖通道。
          # 治开机 bug 只关"交互菜单显示"+ 零等待，让 uboot 直接执行 DTS 里的 bootcmd=mtkboardboot。
          grep -q '^CONFIG_MEDIATEK_BOOTMENU=y' "$DEF" || sed -i 's/^# CONFIG_MEDIATEK_BOOTMENU is not set/CONFIG_MEDIATEK_BOOTMENU=y/' "$DEF"
          grep -q '^CONFIG_MTK_WEB_FAILSAFE=y' "$DEF" || echo 'CONFIG_MTK_WEB_FAILSAFE=y' >> "$DEF"
          grep -q '^CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y' "$DEF" || echo 'CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y' >> "$DEF"
          # 不显示 bootmenu 交互界面（避免上电停住等按键）
          sed -i 's/^CONFIG_AUTOBOOT_MENU_SHOW=y/# CONFIG_AUTOBOOT_MENU_SHOW is not set/' "$DEF"
          sed -i 's/^CONFIG_AUTOBOOT_MENU_MTK_SHOW=y/# CONFIG_AUTOBOOT_MENU_MTK_SHOW is not set/' "$DEF"
          # 启动延时归零，上电立刻执行 bootcmd
          grep -q '^CONFIG_BOOTDELAY=' "$DEF" && sed -i 's/^CONFIG_BOOTDELAY=.*/CONFIG_BOOTDELAY=0/' "$DEF" || echo 'CONFIG_BOOTDELAY=0' >> "$DEF"
          # 启用内置 DHCP server：进 web 恢复时自动给电脑分配 IP，免手动设 192.168.1.*
          grep -q '^CONFIG_MTK_DHCPD=y' "$DEF" || echo 'CONFIG_MTK_DHCPD=y' >> "$DEF"
          # 修复 TimouL fur-602 defconfig 缺失：不开 MTD 核心 → mtdcore.o/mtd_uboot.o/mtdpart.o 不编译
          # → 链接时 mtd_probe_devices/mtd_read_oob 等全部 undefined，ld 直接段错误 (Error 139)
          grep -q '^CONFIG_MTD=y' "$DEF" || echo 'CONFIG_MTD=y' >> "$DEF"
          grep -q '^CONFIG_MTD_PARTITIONS=y' "$DEF" || echo 'CONFIG_MTD_PARTITIONS=y' >> "$DEF"

          # ★★★ 关键修复：mtd_layout 默认值必须是 64m，不能是 114m ★★★
          # 背景：Padavan 把 u-boot-env(mtd1) 当 NVRAM 覆盖 → uboot 读不到 mtd_layout_label
          #      → mtd_layout.c 回退默认值。源码原本默认 "expand(114m)"(116736k ubi)，
      #      但本机 Padavan 实际是 64m 布局(真机 /proc/mtd: mtd5 ubi=64MB)。
      #      布局选错会导致 mtkboardboot 找不到 ubi / 刷写写错分区。
          LAYOUT_C=uboot-mtk-20230718-09eda825/board/mediatek/common/mtd_layout.c
          DTS=uboot-mtk-20230718-09eda825/arch/arm/dts/mt7981-honor_fur-602.dts
          # 1) 改 C 源码默认值：expand(114m) → default(64m)
          sed -i 's/layout_label = "expand(114m)";/layout_label = "default";/' "$LAYOUT_C"
          echo "=== 校验布局改动（默认值应为 default=64m 布局）==="
          grep -n 'layout_label = "' "$LAYOUT_C"

          # ★★★ 最关键：直接给 build.sh 打补丁 ★★★
          # build.sh:75 `cp -f configs/$UBOOT_CFG .config` 会覆盖外部注入；
          # build.sh:81 `make olddefconfig` 又因 Kconfig 循环（MULTI_MTD_LAYOUT → select
          # SYS_MTDPARTS_RUNTIME → depends on MTD）把 CONFIG_MTD 判成 n。
          # 症状：mtdcore.o/mtd_uboot.o/mtdpart.o 不编译 → 链接时几十个 mtd_* undefined + ld 段错误(139)
          # 对策：在 build.sh 的 olddefconfig 之后、make all 之前，强制把 CONFIG_MTD 写进 .config
          # ★★★ 关键：给 build.sh 打补丁，强制启用 MTD 核心 ★★★
          # build.sh:75 `cp -f configs/$UBOOT_CFG .config` 覆盖外部注入；
          # build.sh:81 `make olddefconfig` 因 Kconfig 循环（MULTI_MTD_LAYOUT → select
          # SYS_MTDPARTS_RUNTIME → depends on MTD）把 CONFIG_MTD 判成 n。
          # 症状：mtdcore.o/mtd_uboot.o 不编译 → 链接时几十个 mtd_* undefined + ld 段错误(139)
          # 补丁脚本独立成文件（YAML 内嵌 heredoc 缩进极易出错），本地已 sh -n 校验通过。
          cp -f .github/patch_build_sh.py ./patch_build_sh.py
          python3 ./patch_build_sh.py
          echo "=== build.sh MTD 注入补丁已应用（确认）==="
          grep -n -A6 "force MTD core" build.sh
          sh -n build.sh && echo "build.sh 语法校验通过"
          echo "=== build.sh MTD 注入补丁已应用（确认）==="
          grep -n -A6 "force MTD core" build.sh
          echo "=== 补丁后关键行 ==="
          grep -E 'BOOTMENU|AUTOBOOT|WEB_FAILSAFE|BOOTDELAY|DHCPD|CONFIG_MTD' "$DEF"

      - name: 编译 multi-layout FIP (mt7981 / honor_fur-602 / 2024)
        run: |
          cd src
          chmod +x ./build.sh
          set -o pipefail
          # MTD 强制注入已在上一步骤打进 build.sh（build.sh 会覆盖外部 .config，只能改脚本本身）
          SOC=mt7981 BOARD=honor_fur-602 VERSION=2024 MULTI_LAYOUT=1 ./build.sh 2>&1 | tee build_full.log
          echo "=== 编译后确认 .config 里 MTD 仍为 y ==="
          grep -E '^CONFIG_MTD=|^CONFIG_MTD_PARTITIONS=' uboot-mtk-20230718-09eda825/.config || true

      - name: 质检：产物必须含 web 救援特征串（否则不许刷）
        run: |
          cd src
          FIP=$(ls output/*fip*.bin | head -1)
          echo "检查: $FIP"
          echo "=== 特征串统计（web 救援必须 >0）==="
          for s in "HTTP/1" "Content-Type" "uboot.html" "mtkboardboot" "U-Boot 20"; do
            printf "%-16s: %s\n" "$s" "$(grep -ac "$s" "$FIP" || true)"
          done
          FAIL=0
          for s in "HTTP/1" "uboot.html" "mtkboardboot"; do
            grep -aq "$s" "$FIP" || { echo "❌ 缺少 $s —— web 救援/自动启动不可用，产物不安全"; FAIL=1; }
          done
          # 布局校验：产物必须含 64m 布局标记(65536k ubi)，且 114m 布局字符串应仍存在（保留刷大固件能力）
          printf "%-18s: %s\n" "64m(65536k)布局" "$(grep -ac '65536k' "$FIP" || true)"
          printf "%-18s: %s\n" "114m(116736k)布局" "$(grep -ac '116736k' "$FIP" || true)"
          grep -aq '65536k' "$FIP" || { echo "❌ 缺 64m 布局定义，本机 Padavan 无法正确启动"; FAIL=1; }
          # 自动启动验证：bootmenu 交互界面应已关闭
          if grep -aq "mtkautoboot" "$FIP"; then
            echo "⚠️ 仍含 mtkautoboot 交互菜单串（可能仍会上电停住）"
          else
            echo "✅ mtkautoboot 菜单串已消失（不会上电停住等按键）"
          fi
          echo "=== 产物信息 ==="
          ls -la "$FIP"
          md5sum "$FIP"
          exit $FAIL

      - name: 失败时把日志尾部发到 issue（远程排错用）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "自动编译失败。Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            tail -n 300 src/build_full.log
          } | jq -Rs "{title: \"FIP build fail log run=${GITHUB_RUN_ID}\", body: .}" > payload.json
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/issues -d @payload.json)
          echo "issue POST HTTP=$HTTP"
          grep -o '"html_url": *"[^"]*issues/[^"]*"' /tmp/resp.json || cat /tmp/resp.json

      - name: 失败时把日志 commit 进仓库（raw 公开可读，远程排错）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/build_full.log "build_fail_${GITHUB_RUN_ID}.log" 2>/dev/null || true
          tail -n 3000 src/build_full.log > build_fail_latest.log
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A build_fail_latest.log "build_fail_${GITHUB_RUN_ID}.log" 2>/dev/null || git add -A build_fail_latest.log
          git commit -m "ci: build failure log (run $GITHUB_RUN_ID)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master && echo "PUSH_OK"
          echo "日志地址: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/build_fail_latest.log"

      - name: 失败时上传完整编译日志（artifact 兜底）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-fail-log
          path: src/build_full.log
          if-no-files-found: ignore

      - name: 列出产物
        run: |
          cd src
          ls -la output/ 2>/dev/null || { echo "output 目录为空，编译可能失败"; exit 1; }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: honor_fur-602-autoboot-fip
          path: src/output/*.bin
          if-no-files-found: error
